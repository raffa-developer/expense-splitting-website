<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Divide despesas com amigos, mantém as contas exatas e acerta tudo com o mínimo de transferências."
    />
    <meta name="theme-color" content="#f6f1ea" />
    <title>Expense Splitting — Divide as contas. Mantém a amizade.</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("expense-splitting-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", dark ? "#171310" : "#f6f1ea");
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
